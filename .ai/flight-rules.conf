# flight-rules branch policy for this repository — read by hooks/agent/*,
# hooks/git/* (from HEAD, on the merge target) and the skills. Parsed as data,
# never sourced. See hooks/README.md → Configuration.
#
# Two protected branches. `dev` is where work integrates; `main` is what the public
# and the plugin marketplace see, and it moves only at a release.
#
# The reason is not tidiness. 18 plugin versions reached main in three days (0.13.0 →
# 0.21.5), several of them fixing the version before. Each fix had to be PUBLISHED to be
# integrated, so the public record became the debugging session. On dev the same work is
# one promotion. See rules/git-worktree-workflow.md.
#
# It also closes a dogfooding gap: with no note-gated branch, this repo shipped a note
# gate, a Merge-authorisation trailer and a back-merge exemption that its own workflow
# never ran — synthetic tests were the only coverage. `dev` exercises all three.
PROTECTED_BRANCHES=^(main|dev)$
PR_ONLY_BRANCHES=^main$
NOTE_GATED_BRANCHES=^dev$
INTEGRATION_BRANCH=dev
WORKTREE_DIR=.ai/worktrees
