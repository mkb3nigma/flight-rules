# flight-rules branch policy for this repository — read by hooks/agent/*,
# hooks/git/* (from HEAD, on the merge target) and the skills. Parsed as data,
# never sourced. See hooks/README.md → Configuration.
#
# This repo is trunk-based: main is the integration branch AND PR-only. There is no
# note-gated branch and NOTE_GATED_BRANCHES is therefore absent: unset, the gated set
# is "protected but not PR-only", which here is empty. It used to be spelled
# `^nothing$` against a default that named dev and staging.
PROTECTED_BRANCHES=^main$
PR_ONLY_BRANCHES=^main$
INTEGRATION_BRANCH=main
WORKTREE_DIR=.ai/worktrees
