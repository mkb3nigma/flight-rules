# The two hook suites, on both platforms the hooks run on. macOS matters: it ships
# BSD grep/sed and bash 3.2, and a `grep -P` that worked on Linux was silently
# broken there for weeks.
name: hook tests
on:
  push:
    # dev too: it is the integration branch and it moves by LOCAL merge, which no
    # pull_request event covers. Without this a batch could sit on dev untested until
    # the promotion PR ran, while the docs claimed CI on both branches.
    branches: [main, dev]
  pull_request:
jobs:
  # A PR into main is a release, and a release carries /dg on the whole diff with every
  # finding's disposition (pr-create step 2b). The body is the only artifact that step
  # leaves, so its absence is checked here rather than trusted. Read through env, never
  # interpolated into the script: a PR body is attacker-written text.
  release-review:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: The release PR body carries the adversarial review
        run: |
          if printf '%s\n' "$BODY" | grep -q '^## Adversarial review'; then
            echo "ok  Adversarial review section present"
          else
            echo "::error::PR into main has no '## Adversarial review' section — run /dg origin/main...<sha> (pr-create step 2b) and put the verdict and dispositions in the body"
            exit 1
          fi
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every script
        run: |
          set -e
          for f in hooks/*.sh hooks/agent/*.sh hooks/git/* skills/*.sh; do
            case "$f" in *.md) continue ;; esac
            bash -n "$f" && echo "ok  $f"
          done
      - name: Git hooks are executable
        # A hook tracked as 644 is silently ignored by git ("hook was ignored
        # because it's not set as executable") — the note gate shipped that way.
        run: |
          set -e
          for f in hooks/git/*; do
            case "$f" in *.*) continue ;; esac
            [ -x "$f" ] && echo "ok  $f" || { echo "NOT EXECUTABLE: $f"; exit 1; }
          done
      - name: Agent guard
        run: bash hooks/agent/pre-commit-check.test.sh
      - name: Session-start reminder
        run: bash hooks/agent/session-start.test.sh
      - name: Merge gate
        run: bash hooks/git/merge-gate.test.sh
      - name: Ref gate
        run: bash hooks/git/ref-gate.test.sh
      - name: Secret scan (git pre-commit)
        run: bash hooks/git/secret-scan.test.sh
      - name: Hook install and sync
        run: bash hooks/git/install.test.sh
      - name: Doctor
        run: bash hooks/flight-rules-doctor.test.sh
      - name: Wiring
        run: bash hooks/wiring.test.sh
      - name: Skills catalogue is consistent
        run: bash skills/catalogue.test.sh
      - name: Docs, conf and CI agree with each other
        run: bash docs-consistency.test.sh
