# A PR into main is a release, and a release carries /dg on the whole diff with every
# finding's disposition (pr-create step 2b). The body is the only artifact that step
# leaves, so its absence is checked here rather than trusted.
#
# Its own workflow, with `edited` among its triggers: under a bare `pull_request:` a
# body fixed after a failure was never re-checked, and one emptied after a pass stayed
# green (release review, 2026-10-12). The suites in tests.yml do not need to re-run on
# a body edit, so they keep their own triggers.
name: release review
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
jobs:
  release-review:
    runs-on: ubuntu-latest
    # Read through env, never interpolated into the script: a PR body is
    # attacker-written text.
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: The release PR body carries the adversarial review
        run: |
          body=$(printf '%s\n' "$BODY" | tr -d '\r')
          if ! printf '%s\n' "$body" | grep -q '^## Adversarial review'; then
            echo "::error::PR into main has no '## Adversarial review' section — run /dg origin/main...<sha> (pr-create step 2b), or review that diff yourself, and put the verdict and dispositions in the body"
            exit 1
          fi
          # A heading with nothing under it, or the template's placeholders left in
          # place, is a skipped step that looks done (fix review, 2026-10-12): the
          # section needs a line of its own text before the next heading. The
          # template's placeholders in the section are whole lines beginning `<the `
          # or `<ONLY if `, and only those are skipped: any `<…>` line used to be,
          # so a review written as one-line HTML counted as empty (#84). The opt-in
          # comic is not the review, so counting stops at `### Comic`: with only the
          # `<the /dg verdict` line skipped, the comic slot's lines passed an
          # untouched template (final release /dg, 2026-10-17).
          #
          # Text is not a verdict: the `> Pre-review:` line alone passed (#83). Step
          # 2b puts the verdict's headings one level down, so the section must hold a
          # `### Verdict` — an undemoted `## Verdict` ends the section instead — with
          # text under it that is not a heading: a bare heading, or one holding only
          # its demoted `####` headings, passed too (0.26.0 release review). The
          # verdict runs to the next `###`. A heading has a space or nothing after
          # its hashes, so `#83 applied` is text (0.26.0 fix review), and up to
          # three spaces before them: matched at column 1 only, ` ## Testing` did
          # not end the section and a bare verdict took the text after it (0.26.0
          # third review). Four spaces is an indented code block, so text. An H1,
          # and a `##` followed by a tab or by nothing, end the section too: matched
          # as `## ` only, a bare verdict before one took the text after it (0.26.0
          # fourth review).
          #
          # Known limits, each failing closed or needing a body written to get past it,
          # not one a skipped step leaves, and accepted rather than parsed further (#91,
          # owner, 2026-10-24): a setext heading (`Testing` over `---`) is text; a fence
          # line is recognised at any indent, though four spaces would make it code; a
          # fence opened on a list-marker line (`- ````) is not seen, so its contents
          # count as structure, and a verdict written inside one passes (0.26.0 fourth
          # review's cross-check), while its closing line opens a fence that never closes,
          # so a real `### Verdict` after it is missed and the step fails "has no
          # '### Verdict'" (start the fence on its own line); fence delimiter lines count as
          # verdict text, so an empty fence pair under `### Verdict` passes; the grep
          # above does not know fences, so a body whose only `## Adversarial review` is
          # fenced fails as empty, not as missing; and the `## Adversarial review` line
          # itself must start in column 1. Any text counts, a lone `---` or table header
          # too: an honest verdict with no findings has to pass, and this checks for a
          # skipped step, not a forger.
          #
          # A code fence is text, never structure: a `### Verdict` inside one is an
          # example, and a `## ` inside one does not end the section (0.26.0 fix
          # review). Fences follow CommonMark, as docs-consistency.test.sh's own
          # fence check does: the same character, at least as many, closes one.
          #
          # A dead awk fails the step. `set -- $(…)` exits 0 whatever the awk did, so
          # it left both numbers empty, every test below errored inside its `if`, and
          # the step printed ok (0.26.0 release review).
          counts=$(printf '%s\n' "$body" | awk '
            function run(t, c,   k) { k = 0; while (substr(t, k + 1, 1) == c) k++; return k }
            {
              fence = 0; l = $0; sub(/^[ \t]+/, "", l); c = substr(l, 1, 1)
              if ((c == "`" || c == "~") && (k = run(l, c)) >= 3) {
                if (!in_f) { if (!(c == "`" && index(substr(l, k + 1), "`"))) { in_f = 1; fc = c; fk = k; fence = 1 } }
                else if (c == fc && k >= fk && substr(l, k + 1) ~ /^[ \t]*$/) { in_f = 0; fence = 1 }
              }
              text = in_f || fence
              h = $0; sub(/^(   |  | )/, "", h)
            }
            !text && /^## Adversarial review/ { in_s = 1; next }
            in_s && !text && (h ~ /^##?([[:space:]]|$)/ || h ~ /^###[[:space:]]+Comic/) { in_s = 0 }
            in_s && !text && h ~ /^###([[:space:]]|$)/ { in_v = 0 }
            in_s && !text && h ~ /^###[[:space:]]+Verdict[[:space:]]*$/ { v++; in_v = 1 }
            in_s && /[^[:space:]]/ && !/^[[:space:]]*<(the |ONLY if ).*>[[:space:]]*$/ { n++; if (in_v && (text || h !~ /^#+([[:space:]]|$)/)) b++ }
            END { print n + 0, v + 0, b + 0 }') || { echo "::error::could not read the PR body's Adversarial review section (awk exited $?)"; exit 1; }
          set -- $counts
          [ "$#" -eq 3 ] && [ -z "$(printf '%s' "$*" | tr -d '0-9 ')" ] \
            || { echo "::error::could not read the PR body's Adversarial review section (awk printed '$counts')"; exit 1; }
          filled=$1 verdict=$2 under=$3
          if [ "$filled" -eq 0 ]; then
            echo "::error::the Adversarial review section is empty or still holds the pr-create template's placeholder"
            exit 1
          fi
          if [ "$verdict" -eq 0 ]; then
            echo "::error::the Adversarial review section has no '### Verdict' — put the /dg verdict there with its headings one level down (pr-create step 2b), not only its header lines"
            exit 1
          fi
          if [ "$under" -eq 0 ]; then
            echo "::error::the Adversarial review section's '### Verdict' has nothing under it but headings — put the verdict's findings and dispositions there (pr-create step 2b)"
            exit 1
          fi
          echo "ok  Adversarial review section present, filled, with a verdict"
