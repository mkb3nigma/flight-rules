# A PR into main is a release, and a release carries /dg on the whole diff with every
# finding's disposition (pr-create step 2b). The body is the only artifact that step
# leaves, so its absence is checked here rather than trusted.
#
# Its own workflow, with `edited` among its triggers: under a bare `pull_request:` a
# body fixed after a failure was never re-checked, and one emptied after a pass stayed
# green (release review, 2026-10-12). The suites in tests.yml do not need to re-run on
# a body edit, so they keep their own triggers.
name: release review
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
jobs:
  release-review:
    runs-on: ubuntu-latest
    # Read through env, never interpolated into the script: a PR body is
    # attacker-written text.
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: The release PR body carries the adversarial review
        run: |
          body=$(printf '%s\n' "$BODY" | tr -d '\r')
          if ! printf '%s\n' "$body" | grep -q '^## Adversarial review'; then
            echo "::error::PR into main has no '## Adversarial review' section — run /dg origin/main...<sha> (pr-create step 2b) and put the verdict and dispositions in the body"
            exit 1
          fi
          # A heading with nothing under it, or the template's placeholders left in
          # place, is a skipped step that looks done (fix review, 2026-10-12): the
          # section needs a line of its own text before the next heading. The
          # template's placeholders in the section are whole lines beginning `<the `
          # or `<ONLY if `, and only those are skipped: any `<…>` line used to be,
          # so a review written as one-line HTML counted as empty (#84). The opt-in
          # comic is not the review, so counting stops at `### Comic`: with only the
          # `<the /dg verdict` line skipped, the comic slot's lines passed an
          # untouched template (final release /dg, 2026-10-17).
          #
          # Text is not a verdict: the `> Pre-review:` line alone passed (#83). Step
          # 2b puts the verdict's headings one level down, so the section must hold a
          # `### Verdict` — an undemoted `## Verdict` ends the section instead.
          set -- $(printf '%s\n' "$body" | awk '
            /^## Adversarial review/ { in_s = 1; next }
            in_s && (/^## / || /^### Comic/) { in_s = 0 }
            in_s && /^###[[:space:]]+Verdict[[:space:]]*$/ { v++ }
            in_s && /[^[:space:]]/ && !/^[[:space:]]*<(the |ONLY if ).*>[[:space:]]*$/ { n++ }
            END { print n + 0, v + 0 }')
          filled=$1 verdict=$2
          if [ "$filled" -eq 0 ]; then
            echo "::error::the Adversarial review section is empty or still holds the pr-create template's placeholder"
            exit 1
          fi
          if [ "$verdict" -eq 0 ]; then
            echo "::error::the Adversarial review section has no '### Verdict' — put the /dg verdict there with its headings one level down (pr-create step 2b), not only its header lines"
            exit 1
          fi
          echo "ok  Adversarial review section present, filled, with a verdict"
